name: KitDuel
version: 1.1.0
main: com.kitduel.KitDuelPlugin
api-version: '1.21'
softdepend: [Multiverse-Core]
description: Duel sword + kit GUI + party duel + Multiverse PvP world
commands:
  duel:
    description: KitDuel commands
    aliases: [kitduel, kd]
    usage: /duel help
  party:
    description: Party duel commands
    aliases: [paty, pt]
    usage: /party help
permissions:
  kitduel.use:
    default: true
  kitduel.admin:
    default: op
